[package]
name = "ssz_types"
version = "0.11.0"
edition = "2021"
description = "List, vector and bitfield types for SSZ"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/ReamLabs/ssz_types"
documentation = "https://docs.rs/ssz_types"
keywords = ["ethereum"]
categories = ["cryptography::cryptocurrencies"]

[dependencies]
# Disable default features so we can control "ring" manually
tree_hash = { version = "0.11.0", default-features = false }
ethereum_serde_utils = "0.8.0"
ethereum_ssz = "0.9.0"
serde = "1.0.0"
serde_derive = "1.0.0"
typenum = "1.12.0"
smallvec = "1.8.0"
arbitrary = { version = "1.0", features = ["derive"], optional = true }
itertools = "0.13.0"

[dev-dependencies]
serde_json = "1.0.0"
tree_hash_derive = "0.10.0"

[features]
# Default build enables ring
default = ["with_ring"]

# Enables "ring" feature from tree_hash
with_ring = ["tree_hash/ring"]

# zkvm disables ring — no "with_ring" feature included
zkvm = []
